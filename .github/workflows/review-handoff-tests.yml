name: Review handoff unit tests
on:
  push:
    paths:
      - 'tests/test_review_handoff.py'
      - '.github/workflows/review-handoff-tests.yml'
  pull_request:
    paths:
      - 'tests/test_review_handoff.py'
      - '.github/workflows/review-handoff-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run offline handoff contract tests
        run: python3 -m unittest discover -s tests -p 'test_review_handoff.py' -v
