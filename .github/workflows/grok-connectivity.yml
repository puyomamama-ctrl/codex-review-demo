name: Grok one-shot connectivity check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect xAI model access without chat generation
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${XAI_API_KEY:-}" ]]; then
            echo "Missing XAI_API_KEY repository secret"
            exit 1
          fi
          echo "::add-mask::$XAI_API_KEY"
          umask 077
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          status=$(curl --silent --show-error --max-time 30 --retry 0 \
            --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $XAI_API_KEY" \
            https://api.x.ai/v1/models)
          echo "xAI models endpoint HTTP $status"
          python3 - "$response_file" "$status" <<'PY'
          import json
          import re
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  payload = json.load(f)
          except (OSError, UnicodeError, ValueError, TypeError):
              print("Response format: unreadable")
              sys.exit(1)
          if sys.argv[2] == "200":
              models = payload.get("data", []) if isinstance(payload, dict) else []
              ids = sorted({
                  entry["id"] for entry in models
                  if isinstance(entry, dict)
                  and isinstance(entry.get("id"), str)
                  and re.fullmatch(r"[A-Za-z0-9_.-]{1,100}", entry["id"])
              })
              print("Available model IDs (first 20):", ", ".join(ids[:20]) if ids else "none parsed")
              sys.exit(0 if ids else 1)
          error = payload.get("error", {}) if isinstance(payload, dict) else {}
          if not isinstance(error, dict):
              error = {}
          code = error.get("code")
          safe_codes = {"invalid_request", "invalid_api_key", "unauthorized", "permission_denied",
                        "insufficient_quota", "insufficient_credits", "rate_limit_exceeded",
                        "model_not_found", "not_found"}
          print("Error code:", code if isinstance(code, str) and code in safe_codes else "other_or_unavailable")
          print("Raw API error body suppressed")
          sys.exit(1)
          PY
